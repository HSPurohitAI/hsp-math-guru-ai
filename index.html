<!DOCTYPE html>
<html>
<head>
<title>HSP MATH GURU AI Quiz</title>

<style>
body{
font-family:Arial;
text-align:center;
background:#eef6ff;
padding:20px;
}

.box{
background:white;
padding:20px;
border-radius:15px;
max-width:500px;
margin:auto;
box-shadow:0 0 10px #ccc;
}

h1{
color:#0066cc;
}

#question{
font-size:22px;
font-weight:bold;
}

.option{
display:block;
width:90%;
margin:12px auto;
padding:12px;
background:#e8f1ff;
border-radius:10px;
border:2px solid #0066cc;
font-size:18px;
cursor:pointer;
}

.option:hover{
background:#cce3ff;
}

button{
background:#0066cc;
color:white;
padding:12px 20px;
border:0;
border-radius:8px;
font-size:16px;
}

#result{
font-size:18px;
font-weight:bold;
}
</style>

</head>

<body>

<div class="box">

<h1>HSP MATH GURU AI</h1>

<h3>ધોરણ 3 થી 5 ગણિત ક્વિઝ</h3>

<p id="question"></p>

<div id="options"></div>

<p id="result"></p>

<button onclick="nextQuestion()">આગળનો પ્રશ્ન</button>

</div>


<script>

let quiz=[

{
q:"25 + 15 = ?",
o:["30","40","50","35"],
a:"40",
e:"25 માં 15 ઉમેરવું એટલે 25 + 10 = 35 અને પછી +5 = 40 થાય."
},

{
q:"9 × 6 = ?",
o:["45","54","56","60"],
a:"54",
e:"9 ને 6 વખત ઉમેરવાથી: 9+9+9+9+9+9 = 54 થાય."
},

{
q:"100 - 45 = ?",
o:["55","65","45","50"],
a:"55",
e:"100 માંથી 40 ઘટાડીએ તો 60 બચે અને 5 ઘટાડીએ તો 55 બચે."
},

{
q:"12 × 5 = ?",
o:["50","60","70","55"],
a:"60",
e:"12 ને 5 વખત ઉમેરવાથી 12+12+12+12+12 = 60 થાય."
},

{
q:"81 ÷ 9 = ?",
o:["7","8","9","10"],
a:"9",
e:"81 ને 9 સમાન ભાગમાં વહેંચીએ તો દરેક ભાગ 9 આવે."
}

];


let index=0;
let score=0;


function showQuestion(){

document.getElementById("question").innerHTML=quiz[index].q;

let html="";

quiz[index].o.forEach(function(item){

html += "<div class='option' onclick=\"checkAnswer('"+item+"')\">"+item+"</div>";

});

document.getElementById("options").innerHTML=html;
document.getElementById("result").innerHTML="";

}


function checkAnswer(answer){

if(answer==quiz[index].a){

score++;
document.getElementById("result").innerHTML="✅ સાચો જવાબ! ખૂબ સારું.";

}

else{

document.getElementById("result").innerHTML=
"❌ ખોટો જવાબ<br>✅ સાચો જવાબ: "+quiz[index].a+
"<br>📘 સમજણ: "+quiz[index].e;

}

}


function nextQuestion(){

index++;

if(index<quiz.length){

showQuestion();

}

else{

document.getElementById("question").innerHTML="🎉 ક્વિઝ પૂર્ણ!";

document.getElementById("options").innerHTML=
"તમારો સ્કોર: "+score+"/"+quiz.length;

document.getElementById("result").innerHTML="શાબાશ! ફરી પ્રયાસ કરતા રહો.";

}

}


showQuestion();

</script>

</body>
</html>
