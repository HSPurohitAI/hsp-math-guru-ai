<!DOCTYPE html>
<html>
<head>
<title>HSP MATH GURU AI Quiz</title>

<style>
body{
font-family:Arial;
text-align:center;
background:#f2f7ff;
padding:20px;
}

h1{
color:#1565c0;
}

.box{
background:white;
padding:20px;
border-radius:15px;
max-width:500px;
margin:auto;
box-shadow:0 0 10px #aaa;
}

button{
display:block;
width:90%;
margin:10px auto;
padding:12px;
font-size:18px;
border-radius:10px;
border:none;
background:#1976d2;
color:white;
}

button:hover{
background:#0d47a1;
}

#result{
font-size:18px;
font-weight:bold;
margin-top:15px;
}

#explain{
background:#fff3cd;
padding:10px;
border-radius:10px;
margin-top:10px;
}
</style>
</head>

<body>

<h1>HSP MATH GURU AI</h1>

<div class="box">

<h3>તમારો ગણિતનો પ્રશ્ન:</h3>

<h2 id="question"></h2>

<div id="options"></div>

<div id="result"></div>

<div id="explain"></div>

<h3 id="score"></h3>

<button onclick="nextQuestion()">આગળનો પ્રશ્ન</button>

</div>


<script>

let score=0;

let questions=[
{
q:"25 + 15 = ?",
o:["30","40","45","50"],
a:"40",
e:"25 + 15 કરીએ તો 25 માં 10 ઉમેરવાથી 35 અને બાકી 5 ઉમેરવાથી 40 થાય છે."
},

{
q:"8 × 6 = ?",
o:["42","48","56","64"],
a:"48",
e:"8 ના 6 જૂથ એટલે 8+8+8+8+8+8 = 48."
},

{
q:"100 માંથી 35 બાદ કરીએ તો કેટલા બચે?",
o:["55","65","75","85"],
a:"65",
e:"100 - 35 = 65. એટલે 35 ઘટાડ્યા પછી 65 બચે છે."
},

{
q:"એક ત્રિકોણને કેટલી બાજુ હોય છે?",
o:["2","3","4","5"],
a:"3",
e:"ત્રિકોણમાં 3 બાજુ અને 3 ખૂણા હોય છે."
}

];

let current=0;


function showQuestion(){

let q=questions[current];

document.getElementById("question").innerHTML=q.q;

let html="";

q.o.forEach(function(option){

html += `<button onclick="check('${option}')">${option}</button>`;

});

document.getElementById("options").innerHTML=html;

document.getElementById("result").innerHTML="";
document.getElementById("explain").innerHTML="";

document.getElementById("score").innerHTML="સ્કોર: "+score;

}


function check(answer){

let q=questions[current];

if(answer==q.a){

score++;

document.getElementById("result").innerHTML="✅ સાચો જવાબ!";

document.getElementById("explain").innerHTML=q.e;

}

else{

document.getElementById("result").innerHTML="❌ ખોટો જવાબ";

document.getElementById("explain").innerHTML=
"સાચો જવાબ: "+q.a+"<br><br>સમજણ: "+q.e;

}

}


function nextQuestion(){

current++;

if(current>=questions.length){

current=0;

alert("ક્વિઝ પૂર્ણ! તમારો સ્કોર: "+score);

score=0;

}

showQuestion();

}


showQuestion();

</script>

</body>
</html>
