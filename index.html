<!DOCTYPE html>
<html>
<head>
<title>HSP MATH GURU AI</title>
<style>
body{
  font-family: Arial;
  text-align:center;
  background:#f2f7ff;
  padding:20px;
}
h1{
  color:#0066cc;
}
.box{
  background:white;
  padding:20px;
  border-radius:15px;
  max-width:500px;
  margin:auto;
}
textarea{
  width:90%;
  height:100px;
  font-size:18px;
}
button{
  background:#0066cc;
  color:white;
  border:none;
  padding:12px 25px;
  font-size:18px;
  border-radius:8px;
}
#answer{
  margin-top:20px;
  font-size:20px;
  color:green;
}
</style>
</head>

<body>

<div class="box">
<h1>HSP MATH GURU AI</h1>

<h3>તમારો ગણિતનો પ્રશ્ન લખો</h3>

<textarea id="question"></textarea>
<br><br>

<button onclick="solve()">જવાબ મેળવો</button>

<div id="answer"></div>

</div>

<script>
function solve(){

let q=document.getElementById("question").value;

document.getElementById("answer").innerHTML =
"તમારો પ્રશ્ન: " + q + "<br><br>" +
"આ પ્રશ્નનો જવાબ મેળવવા માટે AI ગણતરી કરશે.";

}
</script>

</body>
</html>
